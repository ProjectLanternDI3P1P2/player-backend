name: Build & push Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Un seul build à la fois : si deux pushs arrivent coup sur coup,
# le plus ancien est annulé pour ne pas écraser le tag avec une vieille image.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: diiageplayerimage/player-image

jobs:
  build-and-push:
    # Un lancement manuel depuis une autre branche ne publie rien.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # tag flottant : toujours la dernière version de main
            type=raw,value=main
            # tag fixe : main-a1b2c3d (sha court du commit)
            type=sha,prefix=main-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
