name: CD - Publish Docker image

# CI owns validation. This workflow is deliberately separate so its runs are
# visible in Actions as the delivery record: a successful main CI publishes the
# exact commit that CI validated. Application release tags add an immutable
# version tag to Docker Hub. contracts-v* tags publish NuGet contracts only.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

# A newer validated main commit supersedes a queued older one, so the floating
# :main tag cannot be overwritten by stale code. Release-tag runs are preserved.
concurrency:
  group: cd-docker-${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

env:
  IMAGE: diiageplayerimage/player-image

jobs:
  publish:
    name: Publish Docker image
    # A workflow_run also exists for pull requests. Never give its code Docker
    # credentials: only a successful CI caused by a push to main may publish.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the validated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # workflow_run itself checks out the default branch by default. Use
          # the triggering CI commit instead, so the delivered image is exactly
          # the image that was validated.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Compute image tags
        id: image
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=7 HEAD)"

          if [ "$EVENT_NAME" = "push" ]; then
            # Release Please creates vX.Y.Z after the release pull request is merged.
            tags="${IMAGE}:${RELEASE_TAG}"
            source="release tag ${RELEASE_TAG}"
          else
            tags="${IMAGE}:main"
            tags+=$'\n'"${IMAGE}:main-${short_sha}"
            source="main commit ${short_sha}"
          fi

          {
            echo "sha=${sha}"
            echo "source=${source}"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image
        shell: bash
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools inspect "$tag" > /dev/null
            echo "Verified $tag"
          done <<< "$TAGS"

      - name: Write delivery summary
        shell: bash
        env:
          SOURCE: ${{ steps.image.outputs.source }}
          TAGS: ${{ steps.image.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Docker image published"
            echo
            echo "- Source: ${SOURCE}"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Tags:"
            while IFS= read -r tag; do
              echo "  - \`${tag}\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
