syntax = "proto3";

package player.v1;

option csharp_namespace = "Player.Contracts.V1";

// Contract owned by the Player microservice. Field numbers are permanent:
// do not reuse a deleted number; reserve it instead.
service PlayerService {
  rpc GetPlayer (GetPlayerRequest) returns (GetPlayerResponse);
}

message GetPlayerRequest {
  // RFC 4122 textual UUID of the player.
  string player_id = 1;
}

message GetPlayerResponse {
  string id = 1;
  string name = 2;
  int32 health = 3;
  int32 max_health = 4;
  int32 attack = 5;
}
